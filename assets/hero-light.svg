<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="ni1ra — a terminal connecting to the Wired">
<defs>
  <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#3a352c" opacity="0.09"/>
  </pattern>
  <radialGradient id="bloom" cx="860" cy="36" r="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#a9701f" stop-opacity="0.1"/>
    <stop offset="1" stop-color="#a9701f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a352c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3a352c" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#3a352c" stop-opacity="0"/>
    </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter>
  <clipPath id="typed">
    <rect x="60" y="238" width="0" height="22">
      <animate attributeName="width" from="0" to="252.4" begin="0.45s" dur="1.05s" fill="freeze"/>
    </rect>
  </clipPath>
</defs>
<rect width="1000" height="300" fill="#efece4"/>
<rect width="1000" height="300" fill="url(#bloom)"/>
<g stroke="#9a9488" fill="none" opacity="0.8">
