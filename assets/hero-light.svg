</line>
<g clip-path="url(#typed)">
  <text x="64" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#6e6a62" textLength="248.39999999999998" lengthAdjust="spacing">&gt; navi --connect --layer 07</text>
</g>
<rect x="64" y="241" width="8" height="14" fill="#a9701f" opacity="0">
