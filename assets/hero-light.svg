</path>
<text x="64" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="72" fill="#1c1b19" textLength="260" lengthAdjust="spacing">ni1ra</text>
